[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultlinker"
version = "0.5.1"
description = "Vault Linker — batch-link note titles in an Obsidian vault as wikilinks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Arshad Mehmood" }]
keywords = ["obsidian", "markdown", "wikilinks", "notes", "vault-linker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "tqdm>=4.62.3",
]

[project.urls]
Homepage = "https://github.com/arshad115/vault-linker"
Repository = "https://github.com/arshad115/vault-linker"
Issues = "https://github.com/arshad115/vault-linker/issues"
Documentation = "https://github.com/arshad115/vault-linker#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.1.2",
]

[project.scripts]
vaultlinker = "vault_linker.cli:main"
obsidian-linker = "vault_linker.cli:main"

[tool.setuptools.packages.find]
include = ["vault_linker*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
